<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FamilyPoints</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#4f46e5">

  <!-- Tailwind CSS y Supabase Client -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen pb-24 font-sans">

  <!-- Header principal -->
  <header class="bg-gradient-to-r from-indigo-600 to-violet-600 text-white p-5 shadow-lg rounded-b-3xl">
    <div class="max-w-md mx-auto space-y-4">
      <div class="flex justify-between items-center">
        <div class="flex items-center space-x-3">
          <div id="currentAvatar" class="text-3xl bg-white/20 p-2 rounded-2xl backdrop-blur-md">👦</div>
          <div>
            <p class="text-xs text-indigo-200 font-bold uppercase tracking-wider">Usuario actual</p>
            <select id="userSelect" onchange="switchUser()" class="bg-white/10 text-white font-extrabold text-sm rounded-lg px-2 py-1 outline-none border border-white/20 cursor-pointer">
              <!-- Se rellena automáticamente con JS -->
            </select>
          </div>
        </div>
        <span id="roleBadge" class="text-[10px] font-black uppercase tracking-widest bg-amber-400 text-amber-950 px-2.5 py-1 rounded-full shadow-sm">HIJO</span>
      </div>

      <!-- Tarjeta Puntos -->
      <div class="bg-white/10 backdrop-blur-md p-4 rounded-2xl border border-white/20 flex justify-between items-center">
        <div>
          <p class="text-xs font-semibold text-indigo-100">Puntos Disponibles</p>
          <div class="flex items-baseline space-x-1">
            <span id="userPoints" class="text-3xl font-black tracking-tight">0</span>
            <span class="text-lg">⭐</span>
          </div>
        </div>
      </div>
    </div>
  </header>

  <!-- Navegación -->
  <main class="max-w-md mx-auto p-4 space-y-6">
    <nav class="grid grid-cols-3 gap-2 bg-slate-200/60 p-1.5 rounded-2xl text-xs font-bold text-center">
      <button id="tabTasksBtn" onclick="switchTab('tasks')" class="py-2.5 rounded-xl bg-white text-indigo-600 font-extrabold shadow-sm transition-all">Tasks</button>
      <button id="tabRewardsBtn" onclick="switchTab('rewards')" class="py-2.5 rounded-xl text-slate-500 font-bold transition-all">Premios</button>
      <button id="tabParentBtn" onclick="switchTab('parent')" class="py-2.5 rounded-xl text-slate-500 font-bold transition-all hidden">Panel Padres</button>
    </nav>

    <!-- Pestaña Tareas -->
    <section id="tasksTab" class="space-y-3">
      <div class="flex justify-between items-center px-1">
        <h2 class="font-extrabold text-sm uppercase tracking-wider text-slate-400">Tareas Misas</h2>
        <span id="taskCountText" class="text-xs font-bold text-indigo-600 bg-indigo-50 px-2.5 py-1 rounded-full">0 pendientes</span>
      </div>
      <div id="taskList" class="space-y-2.5">
        <!-- Renderizado dinámico -->
      </div>
    </section>

    <!-- Pestaña Premios -->
    <section id="rewardsTab" class="space-y-3 hidden">
      <h2 class="font-extrabold text-sm uppercase tracking-wider text-slate-400 px-1">Catálogo de Premios</h2>
      <div id="rewardList" class="grid grid-cols-2 gap-3">
        <!-- Renderizado dinámico -->
      </div>
    </section>

    <!-- Pestaña Panel Padres -->
    <section id="parentTab" class="space-y-4 hidden">
      <div class="bg-amber-500/10 border border-amber-500/20 p-4 rounded-2xl space-y-3">
        <h3 class="font-extrabold text-amber-900 text-xs uppercase tracking-wider">Pendientes de Aprobar</h3>
        <div id="parentApprovalList" class="space-y-2">
          <!-- Renderizado dinámico -->
        </div>
      </div>
    </section>
  </main>

  <!-- Script externo con versión forzada -->
  <script src="app.js?v=3"></script>
</body>
</html>
